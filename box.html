<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .content_box {
      background-color: red;
      box-sizing: content-box;
      width: 100px;
      height: 100px;
      margin: 10px;
      padding: 10px;
      border: 10px;
    }
    .border_box {
      background-color: blue;
      box-sizing: border-box;
      width: 100px;
      height: 100px;
      margin: 10px;
      padding: 10px;
      border: 10px;
    }
  </style>
</head>
<body>
  <div class="content_box">

  </div>
  <div class="border_box">

  </div>
</body>
</html>
<script>
  /* 
    content-box：标准模型
    结论： border-box： 盒子宽高 = 宽高
          content-box 盒子宽高 = 宽高 + border + padding
          margin两者都不算
  */
</script>
