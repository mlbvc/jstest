<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .grand {
      position: relative;
      width: 100px;
      height: 100px;
      padding: 0;
      background-color: wheat;
    }
    .parent {
      /* position: relative; */
      width: 50px;
      height: 50px;
      padding: 10px;
      background-color: aquamarine;
    }
    .child {
      position: absolute;
      width: 10%;
      height: 10%;
      /* padding: 10%; */
      background-color: black;
    }
  </style>
</head>
<body>
  <div class="grand">
    <div class="parent">
      <div class="child">

      </div>
    </div>
  </div>
</body>
</html>
<script>
  /* 
    结论： absolute 绝对定位 和父级的定位有关系
      父级相对定位则以父级为主：宽高的 10% ：50px*0.1 = 5px
      父级绝对定位则以最上级为主 宽高的 10% ：100px*0.1 = 10px
  */
</script>
